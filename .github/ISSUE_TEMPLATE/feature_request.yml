name: Feature request
description: Propose a developer workflow or safety improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Developer problem
      description: What store operation is slow, risky, or incomplete today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior, not only the UI.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Store and safety considerations
      description: Include affected APIs, permissions, review states, rollback, or verification needs.

server {
    listen 80;
    listen [::]:80;
    server_name storeops.dev www.storeops.dev;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 301 https://www.storeops.dev$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name storeops.dev www.storeops.dev;
    ssl_certificate /etc/letsencrypt/live/storeops.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/storeops.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    if ($host = storeops.dev) { return 301 https://www.storeops.dev$request_uri; }
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:13200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }
}
